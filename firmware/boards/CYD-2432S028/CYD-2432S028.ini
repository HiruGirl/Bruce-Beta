; PlatformIO Project Configuration File
;
; CYD-2432S028 — the classic 2.8" Cheap Yellow Display (SPI touch, 240x320)
;
; Two builds are offered:
;   - CYD-2432S028            : full build (parity reference)
;   - CYD-2432S028-JSLITE     : trimmed "JS-Lite" build (WiFi + BLE + JS Interpreter)
;     - no RF/IR/RFID/GPS/FM/BadUSB and all non-kept menu items are hidden
;     - the JS interpreter is kept (Startup App + scripts via SD)

##################################### CYD BASE ####################################################
[CYD_base]
board = esp32
monitor_speed = 115200
board_build.partitions = custom_4Mb_full.csv
build_src_filter =${env.build_src_filter} +<../boards/CYD-2432S028>
build_flags =
	${env.build_flags}
	${env_4mb.build_flags}
	-Iboards/CYD-2432S028

	; ==================== Framework Control Flags ====================
	;-DARDUINO_USB_CDC_ON_BOOT=1  ; Used only in ESP32-S3 to make Serial Comands work

	; ==================== Feature gates ====================
	;TouchScreen Controller
	-DHAS_TOUCH=1

	; ==================== Library Flags ====================

	;TFT_eSPI Setup
	-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1
	-DILI9341_2_DRIVER=1
	-DUSE_HSPI_PORT=1
	-DTFT_HEIGHT=320
	-DTFT_WIDTH=240
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BACKLIGHT_ON=HIGH
	-DSMOOTH_FONT=1

	; ==================== Environment Flags ====================
	;Buttons configuration
	-DBTN_ALIAS='"Ok"'

	;Infrared Led default pin and state
	-DIR_TX_PINS='{{"Pin 22", 22}, {"Pin 27", 27}}'
	-DIR_RX_PINS='{{"Pin 27", 27}, {"Pin 22", 22}, {"Pin 35", 35}}'

	;Radio Frequency (one pin modules) pin setting
	-DRF_TX_PINS='{{"Pin 22", 22}, {"Pin 27", 27}}'
	-DRF_RX_PINS='{{"Pin 27", 27}, {"Pin 22", 22}, {"Pin 35", 35}}'

	-DROTATION=3

	-DDEEPSLEEP_WAKEUP_PIN=36
	-DDEEPSLEEP_PIN_ACT=LOW


lib_deps =
	${env.lib_deps}

lib_ignore =
	${env_4mb.lib_ignore}


##################################### CYD MODELS ####################################################
[env:CYD-2432S028-JSLITE]
extends = CYD_base
board_build.partitions = custom_4Mb_full.csv
build_flags =
	${CYD_base.build_flags}
	${env_light.build_flags}

	; ==================== Library Flags ====================
	-DTOUCH_CTRL_XPT2046=1 # hal_touch_init/hal_touch_read (src/hal/inputs/touch.cpp)
	-DHAS_RESISTIVE_TOUCH=1 # touch calibration screen + NVS storage (core/settings.cpp)
	-DTFT_BL=21
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=16000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DTOUCH_CS=33

	; ==================== Environment Flags ====================
	-DDEVICE_NAME='"CYD-2432S028"'

lib_deps =
	${env_light.lib_deps}

################################# END OF CYD MODELS ####################################################
